<aside class="sidebar" [class.sidebar--collapsed]="collapsed">
  <!-- Logo Header + Toggle -->
  <div class="sidebar__header">
    <div class="logo">
      <span class="logo__text"><span class="logo__pitch">Pitch</span><span class="logo__craft">Craft</span>&nbsp;<span class="logo__ai">AI</span></span>
    </div>
    <button type="button" class="sidebar__toggle" (click)="toggleSidebar()" [attr.title]="collapsed ? 'Expand sidebar' : 'Collapse sidebar'">
      <i-lucide [name]="collapsed ? getIcon('PanelLeftOpen') : getIcon('PanelLeftClose')" [size]="20" class="sidebar__toggle-icon"></i-lucide>
    </button>
  </div>

  <!-- Main Navigation -->
  <nav class="sidebar__nav">
    <ul class="nav-list">
      <li *ngFor="let item of menuItems$ | async" class="nav-item">
        <a 
          [routerLink]="item.route"
          class="nav-link"
          [class.nav-link--active]="isActive(item.route)"
          [title]="item.label"
        >
          <i-lucide 
            [name]="getIcon(item.icon)" 
            [size]="20" 
            class="nav-link__icon"
          ></i-lucide>
          <span class="nav-link__text">{{ item.label }}</span>
          <span *ngIf="item.badge" class="nav-link__badge">{{ item.badge }}</span>
        </a>
      </li>
    </ul>
  </nav>

  <!-- Bottom Section (Settings) -->
  <div class="sidebar__footer">
    <ul class="nav-list">
      <li *ngFor="let item of bottomItems$ | async" class="nav-item">
        <a 
          [routerLink]="item.route"
          class="nav-link nav-link--highlight"
          [class.nav-link--active]="isActive(item.route)"
          [title]="item.label"
        >
          <i-lucide 
            [name]="getIcon(item.icon)" 
            [size]="20" 
            class="nav-link__icon"
          ></i-lucide>
          <span class="nav-link__text">{{ item.label }}</span>
        </a>
      </li>
      <li class="nav-item">
        <button type="button" class="nav-link nav-link--logout" (click)="logout()" title="Log out">
          <i-lucide [name]="getIcon('LogOut')" [size]="20" class="nav-link__icon"></i-lucide>
          <span class="nav-link__text">Log out</span>
        </button>
      </li>
    </ul>
  </div>
</aside>
