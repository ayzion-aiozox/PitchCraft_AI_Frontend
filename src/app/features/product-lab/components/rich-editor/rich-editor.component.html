<div class="rich-editor">
  <div class="editor-toolbar">
    @for (item of toolbarItems; track $index) {
      @if (item === 'sep') {
        <div class="toolbar-sep" aria-hidden="true"></div>
      } @else {
        <button
          type="button"
          class="tool-btn"
          [class.active]="isActive(item)"
          [attr.title]="itemTitle(item)"
          [attr.aria-label]="itemTitle(item)"
          (mousedown)="onToolbarMouseDown($event)"
          (click)="applyFormat(item)"
        >
          <lucide-icon [img]="item.icon" [size]="16"></lucide-icon>
        </button>
      }
    }
  </div>
  <div
    #editor
    class="editor-surface"
    [class.is-empty]="isEmpty"
    [attr.data-placeholder]="placeholder"
    contenteditable="true"
    spellcheck="true"
    (input)="onEditorInput()"
    (blur)="onEditorInput()"
  ></div>
</div>
